# Hetzner live pilot — nginx terminates TLS on the host.
# App binds 127.0.0.1 only. Dedicated Postgres + MinIO (no mihai-* reuse).
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_URL: ${APP_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-coop-launch}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-10}
      LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-15}
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - coop_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/health | grep -q '\"ok\":true' || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: builder
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
    working_dir: /app
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - coop_internal

  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: builder
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
      SEED_PASSWORD_NESLI: ${SEED_PASSWORD_NESLI}
      SEED_PASSWORD_FOUNDER: ${SEED_PASSWORD_FOUNDER}
      SEED_PASSWORD_ADMIN: ${SEED_PASSWORD_ADMIN}
      SEED_PASSWORD_ADVISER: ${SEED_PASSWORD_ADVISER:-}
    working_dir: /app
    command: ["pnpm", "exec", "tsx", "prisma/seed.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - coop_internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-coop_launch}
    volumes:
      - coop_prod_pg:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - coop_internal

  # Pilot object store: adobe/s3mock (minio/minio Hub pulls were denied on this host).
  # Replace with Hetzner Object Storage or MinIO when credentials/images are available.
  minio:
    image: adobe/s3mock:3.12.0
    restart: unless-stopped
    environment:
      initialBuckets: ${S3_BUCKET:-coop-launch}
      retainFilesOnExit: "true"
      root: /data
    volumes:
      - coop_prod_minio:/data
    ports:
      - "127.0.0.1:9010:9090"
    networks:
      - coop_internal

networks:
  coop_internal:
    name: coop_launch_internal
    driver: bridge

volumes:
  coop_prod_pg:
  coop_prod_minio:
